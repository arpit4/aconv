name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macOS is included deliberately: the collision handling depends on how the
    # filesystem folds case, and the interrupt and pty tests depend on how the
    # platform delivers signals, so Linux alone would not exercise either.
    #
    # Windows is deliberately absent. The GUI and the cancel channel are
    # expected to work there (Tk ships with the python.org installer, and
    # terminate() is not a signal), but neither is verified, so the matrix
    # does not claim it. The two tests that cannot run off POSIX skip
    # themselves, so the suite still passes if you run it there by hand.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Report the ffmpeg build under test
        # Codec defaults vary between ffmpeg versions, and at least one test
        # depends on the .ogg container's choice, so record what ran.
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest test_aconv -v

      - name: Run GUI tests
        # Headless runners have no display, so the Tk smoke test skips itself;
        # everything below the App layer runs regardless.
        run: python -m unittest test_aconv_gui -v
